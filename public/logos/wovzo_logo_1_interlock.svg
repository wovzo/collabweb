<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181D"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>

    <!-- Orange Vibrant Gradient -->
    <linearGradient id="wovzoOrange1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="50%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#E54F00"/>
    </linearGradient>

    <!-- Secondary Accent Ribbon -->
    <linearGradient id="wovzoGold1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5100"/>
      <stop offset="100%" stop-color="#FFA834"/>
    </linearGradient>

    <!-- Sky Blue Sparkle Accent -->
    <linearGradient id="skyGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF6A00" flood-opacity="0.38"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base App Icon Frame -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad1)" stroke="#26262E" stroke-width="3" filter="url(#badgeShadow)"/>

  <!-- Subtle Radial Ambient Light inside icon -->
  <circle cx="256" cy="230" r="160" fill="#FF6A00" opacity="0.12"/>

  <!-- Geometric Interlocking 'W' Group -->
  <g filter="url(#softGlow1)">
    <!-- Left Loop (Creator Node) -->
    <path d="M120 160 C120 142 142 134 154 148 L206 288 C212 304 234 304 240 288 L272 200 C276 188 292 188 296 200 L328 288 C334 304 356 304 362 288 L414 148 C426 134 448 142 448 160 C448 174 438 186 432 198 L374 340 C358 376 312 376 296 340 L256 252 L216 340 C200 376 154 376 138 340 L80 198 C74 186 64 174 64 160 Z" fill="none"/>

    <!-- Left Arm -->
    <path d="M112 168 L170 332 C182 366 226 366 238 332 L274 230 C279 216 299 216 304 230 L340 332 C352 366 396 366 408 332 L466 168 C472 150 452 136 438 148 L386 286 C382 296 368 296 364 286 L326 182 C316 154 276 154 266 182 L228 286 C224 296 210 296 206 286 L154 148 C140 136 120 150 126 168" fill="url(#wovzoOrange1)"/>

    <!-- Interlocking Handshake Bridge (Brand & Creator Harmony) -->
    <path d="M228 286 L256 210 L284 286 C290 300 278 316 264 316 C250 316 238 300 228 286 Z" fill="url(#wovzoGold1)"/>
    
    <!-- Central Connection Diamond / Blue verified touch -->
    <polygon points="256,168 266,184 256,200 246,184" fill="url(#skyGlow1)"/>
    <circle cx="256" cy="184" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Brand Subtext / Indicator Dots -->
  <circle cx="200" cy="420" r="4" fill="#FF6A00" opacity="0.6"/>
  <circle cx="256" cy="420" r="5" fill="#38BDF8"/>
  <circle cx="312" cy="420" r="4" fill="#FF6A00" opacity="0.6"/>
</svg>
